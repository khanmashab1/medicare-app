kind = "mobile"
previewPath = "/"
title = "MediCare+"
version = "1.0.0"
id = "artifacts/medicare"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 20112

[services.development]
run = "pnpm --filter @workspace/medicare run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/medicare", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/medicare", "run", "serve" ]

[services.env]
PORT = "20112"
BASE_PATH = "/"
